[[apps]]
title = 'Faugus Launcher'
icon_png_path = "https://games-on-whales.github.io/wildlife/apps/faugus-launcher/assets/icon.png"

[apps.runner]
type = 'docker'
name = 'WolfFaugusLauncher'
image = 'ghcr.io/games-on-whales/faugus-launcher:edge'
env = ['RUN_SWAY=true', 'GOW_REQUIRED_DEVICES=/dev/input/* /dev/dri/* /dev/nvidia*', 'ADW_DEBUG_COLOR_SCHEME=prefer-dark', 'GTK_THEME=Adwaita:dark']
devices = []
mounts = []
ports = []
base_create_json = '''{
  "HostConfig": {
      "IpcMode": "host",
      "CapAdd": ["SYS_ADMIN", "SYS_NICE", "SYS_PTRACE", "NET_RAW", "MKNOD", "NET_ADMIN"],
      "SecurityOpt": ["seccomp=unconfined", "apparmor=unconfined"],
      "Ulimits": [{"Name":"nofile", "Hard":10240, "Soft":10240}],
      "Privileged": false,
      "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw"]
    }
}'''
